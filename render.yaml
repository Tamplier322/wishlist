services:
  - type: web
    name: wishlist-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/readyz
    # Preview environments: каждый PR получает отдельный инстанс
    # со своими переменными окружения (staging).
    previewsEnabled: true
    previewsExpireAfterDays: 7
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: METRICS_TOKEN
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_SERVICE_NAME
        value: wishlist-api
      - key: ENABLE_TEST_SEED
        value: '0'
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: wishlist-271f9
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: APP_URL
        value: https://wishlist-xre9.onrender.com
      - key: PUBLIC_API_URL
        value: https://wishlist-xre9.onrender.com
      - key: CORS_ORIGINS
        value: https://wishlist-xre9.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: VAPID_PUBLIC_KEY
        value: BD3Eb15yYRl9aWs_8fPKxNj99C23OrziKWm0XzgcgHIjhpcLC-vafXy-EWgnK46WL-lTg-jHM1UpYFk3C9wQg_I
      - key: VAPID_PRIVATE_KEY
        value: cKTzfmVgsbdnH6YMBm9jElVUcpPfj60N0d5pJPLHl58
      - key: UPLOADS_DIR
        value: data/uploads
