name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (server + client)
        run: npm install

      - name: Typecheck + build
        run: npm run build

      - name: Install Playwright browsers
        run: cd client && npx playwright install --with-deps chromium

      - name: E2E tests
        run: cd client && npx playwright test --reporter=line
